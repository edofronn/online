<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HOME -->
<div id="home" class="view active">
  <div class="center">

    <div class="cards">

      <div class="card" onclick="navigate('png')">
        <h2>PNG</h2>
      </div>

      <div class="card" onclick="navigate('text')">
        <h2>TEXT</h2>
      </div>

      <div class="card" onclick="navigate('school')">
        <h2>SCUOLA</h2>
      </div>

    </div>

  </div>
</div>

<!-- PNG -->
<div id="png" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
  </div>

  <div class="dropzone" id="png-drop">
    Drop image or click
    <input type="file" id="png-input" accept="image/*">
  </div>

  <div class="viewer" id="png-viewer">
    <img id="png-img">
  </div>
</div>

<!-- TEXT -->
<div id="text" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
  </div>

  <textarea id="text-area" placeholder="Scrivi qui..."></textarea>
</div>

<!-- SCHOOL -->
<div id="school" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
  </div>

  <div class="dropzone" id="school-drop">
    Drop image or click
    <input type="file" id="school-input" accept="image/*">
  </div>

  <div class="viewer" id="school-viewer">
    <img id="school-img">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
