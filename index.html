<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HOME -->
<div id="home" class="view active">
  <div class="center">
    <div class="cards-wrapper">
      <div class="card" onclick="navigate('png')">
        <h2>PNG</h2>
      </div>
      <div class="card" onclick="navigate('text')">
        <h2>TEXT</h2>
      </div>
      <div class="card" onclick="navigate('school')">
        <h2>SCUOLA</h2>
      </div>
    </div>
  </div>
</div>

<!-- PNG VIEW -->
<div id="png" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
    <button onclick="resetView('png')">Reset</button>
  </div>
  <div id="png-dropzone" class="dropzone" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'png')">
    Drop PNG here
  </div>
  <div id="png-viewer" class="viewer">
    <img id="png-img">
  </div>
</div>

<!-- TEXT VIEW -->
<div id="text" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
    <button onclick="resetView('text')">Reset</button>
  </div>
  <div id="text-dropzone" class="dropzone" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'text')">
    Drop Text Image here
  </div>
  <div id="text-viewer" class="viewer">
    <img id="text-img">
  </div>
</div>

<!-- SCHOOL VIEW -->
<div id="school" class="view">
  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
    <button onclick="resetView('school')">Reset</button>
  </div>
  <div id="school-dropzone" class="dropzone" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'school')">
    Drop School Image here
  </div>
  <div id="school-viewer" class="viewer">
    <img id="school-img">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
