<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HOME -->
<div id="home" class="view active">
  <div class="center">
    <div class="card" onclick="navigate('png')">
      <h2>PNG</h2>
    </div>
  </div>
</div>

<!-- PNG VIEWER -->
<div id="png" class="view">

  <div class="topbar">
    <button onclick="navigate('home')">Back</button>
    <button onclick="resetUpload()">Upload</button>
  </div>

  <div id="dropzone">
    Drop image here
  </div>

  <div id="viewer">
    <img id="img">
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
